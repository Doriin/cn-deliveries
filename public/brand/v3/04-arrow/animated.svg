<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.46 -109.74 412.83 119.49" width="640" height="185.2"><title>CNX</title><style>
  .c{animation:c-in .45s cubic-bezier(.2,.8,.2,1) both}
  .nx{animation:nx-in .6s .15s cubic-bezier(.16,1,.3,1) both, kick .42s 1.22s cubic-bezier(.3,0,.2,1) both}
  .slot{transform-box:fill-box;transform-origin:right center;animation:open-slot .42s .72s cubic-bezier(.7,0,.2,1) both}
  .tip{transform-box:fill-box;transform-origin:right center;animation:open-tip .2s 1.08s cubic-bezier(.5,0,.2,1) both}
  @keyframes c-in{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
  @keyframes nx-in{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
  @keyframes kick{0%{transform:none}35%{transform:translateX(4px)}100%{transform:none}}
  @keyframes open-slot{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  @keyframes open-tip{from{transform:scaleX(1)}to{transform:scaleX(0)}}
